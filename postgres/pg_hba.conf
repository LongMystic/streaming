# Shared by primary and replica.
# TYPE  DATABASE     USER  ADDRESS          METHOD

# Unix socket inside the container
local   all          all                    scram-sha-256

# Loopback inside the container (healthchecks)
host    all          all   127.0.0.1/32     scram-sha-256

# Docker network "streaming" (see ipam in docker-compose.yml)
host    all          all   172.28.0.0/24    scram-sha-256

# Only roles with the REPLICATION attribute can use this entry.
host    replication  all   172.28.0.0/24    scram-sha-256
