listen_addresses = '*'
port = 5432

# enable wal-based replication
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10

# Authentication
password_encryption = 'scram-sha-256'

# WAL retention for this lab
wal_keep_size = '256MB'

# cap WAL held by an inactive replication slot so the disk cannot fill up
max_slot_wal_keep_size = '1GB'

# logging
log_connections = on
log_replication_commands = on

hba_file = '/etc/postgresql/pg_hba.conf'